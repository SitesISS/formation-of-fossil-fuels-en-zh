  "teach": "<button type=\"button\" class=\"listen\" data-listen>🔊 Listen (English)</button>\n<p>Coal formed from <b>plants</b>: big tree ferns and other trees. They grew in <b>swamp forests</b>. The land was warm, wet and low.<span class=\"zh\">煤由<b>植物</b>形成：巨大的树蕨和其他树木。它们生长在<b>沼泽森林</b>里。那里温暖、潮湿、地势低。</span></p>\n<p>Most coal formed about <b>300 million years ago</b>. This time is called the <b>Carboniferous period</b>.<span class=\"zh\">大部分煤形成于大约<b>3亿年前</b>。这个时期叫做<b>石炭纪</b>。</span></p>\n<p>The plants died and fell into the swamp water. The ground was <b>waterlogged</b> (full of water). There was very little oxygen, so the plants only <b>partly</b> decayed.<span class=\"zh\">植物死后倒进沼泽的水里。地面<b>积满了水</b>。那里氧气很少，所以植物只是<b>部分</b>分解。</span></p>\n<p>Layers of dead plants built up. They made a soft, brown material called <b>peat</b>. Peat is the <b>first stage</b> of coal.<span class=\"zh\">一层层死去的植物堆积起来，形成一种柔软的褐色物质，叫做<b>泥炭</b>。泥炭是煤形成的<b>第一阶段</b>。</span></p>\n{{FIG:swamp}}\n<div class=\"gloss\"><h3>Key words <span class=\"zhi\">关键词</span></h3><div class=\"tblwrap\"><table class=\"st\"><thead><tr><th>English</th><th>中文</th><th>Meaning</th></tr></thead><tbody><tr><td><button type=\"button\" class=\"say\" data-say=\"swamp\" aria-label=\"Listen to swamp\">🔊</button> <b>swamp</b></td><td class=\"zhc\">沼泽</td><td>wet land with trees and still water</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"waterlogged\" aria-label=\"Listen to waterlogged\">🔊</button> <b>waterlogged</b></td><td class=\"zhc\">积水的</td><td>full of water</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"tree fern\" aria-label=\"Listen to tree fern\">🔊</button> <b>tree fern</b></td><td class=\"zhc\">树蕨</td><td>a big fern plant like a tree</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"peat\" aria-label=\"Listen to peat\">🔊</button> <b>peat</b></td><td class=\"zhc\">泥炭</td><td>soft brown material from part-decayed plants</td></tr><tr><td><button type=\"button\" clas   "tz": "煤（二）：从泥炭到煤",
  "teach": "<button type=\"button\" class=\"listen\" data-listen>🔊 Listen (English)</button>\n<p>Later, the sea or rivers flooded the swamp. <b>Sediment</b> (sand and mud) covered the peat. More and more layers built up on top.<span class=\"zh\">后来，海水或河水淹没了沼泽。<b>沉积物</b>（沙和泥）覆盖了泥炭。上面堆积了越来越多的层。</span></p>\n<ul class=\"pts\">\n<li>The <b>pressure</b> went up. It squeezed out <b>water</b>.<span class=\"zh\"><b>压力</b>增大，把<b>水</b>挤了出来。</span></li>\n<li>The <b>temperature</b> went up because it was deeper.<span class=\"zh\">因为埋得更深，<b>温度</b>升高了。</span></li>\n<li>After <b>millions of years</b>, heat and pressure changed the peat into <b>coal</b>.<span class=\"zh\">经过<b>数百万年</b>，热和压力把泥炭变成了<b>煤</b>。</span></li>\n</ul>\n{{FIG:coalstages}}\n<p>Deeper and longer burial makes better coal. Each stage has <b>more carbon</b> and less water. It is harder and gives more energy when burned.<span class=\"zh\">埋得越深、越久，煤的质量越好。每个阶段的<b>碳更多</b>，水更少。它更硬，燃烧时释放更多能量。</span></p>\n{{FIG:rank}}\n<p class=\"examtip\">Coal is found in <b>seams</b> (layers) between other rocks, such as sandstone and shale.<span class=\"zh\">煤以<b>煤层</b>的形式存在于其他岩石之间，例如砂岩和页岩。</span></p>\n<div class=\"gloss\"><h3>Key words <span class=\"zhi\">关键词</span></h3><div class=\"tblwrap\"><table class=\"st\"><thead><tr><th>English</th><th>中文</th><th>Meaning</th></tr></thead><tbody><tr><td><button type=\"button\" class=\"say\" data-say=\"compress / squash\" aria-label=\"Listen to compress / squash\">🔊</button> <b>compress / squash</b></td><td class=\"zhc\">压缩 / 压扁</td><td>to push something so it gets smaller</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"coalification\" aria-label=\"Listen to coalification\">🔊</button> <b>coalification</b></td><td class=\"zhc\">煤化作用</td><td>peat changing into coal</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"lignite\" aria-label=\"Listen to lignite\">🔊</button> <b>lignite</b></td><td class=\"zhc\">褐煤</td><td>brown coal: soft, less carbon</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"bituminous coal\" aria-label=\"Listen to bituminous coal\">🔊</button> <b>bituminous coal</b></td><td class=\"zhc\">烟煤</td><td>hard black coal</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"anthracite\" aria-label=\"Listen to anthracite\">🔊</button> <b>anthracite</b></td><td class=\"zhc\">无烟煤</td><td>very hard, shiny coal with the most carbon</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"carbon content\" aria-label=\"Listen to carbon content\">🔊</button> <b>carbon content</b></td><td class=\"zhc\">含碳量</td><td>how much carbon is in it</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"seam\" aria-label=\"Listen to seam\">🔊</button> <b>seam</b></td><td class=\"zhc\">煤层</td><td>a layer of coal in the rock</td></tr></tbody></table></div></div>\n",

  "tz": "石油（原油）",
  "teach": "<button type=\"button\" class=\"listen\" data-listen>🔊 Listen (English)</button>\n<p>Oil did <b>not</b> form from land plants. It formed from <b>plankton</b>. Plankton are very small living things in the sea: tiny algae and tiny animals.<span class=\"zh\">石油<b>不是</b>由陆地植物形成的。它由<b>浮游生物</b>形成。浮游生物是海里非常小的生物：微小的藻类和微小的动物。</span></p>\n<ol class=\"steps\">\n<li>The plankton died and <b>sank</b> to the <b>seabed</b>.<span class=\"zh\">浮游生物死后<b>沉</b>到<b>海底</b>。</span></li>\n<li>They mixed with <b>mud</b>. There was very little oxygen. Decay was <b>incomplete</b>.<span class=\"zh\">它们和<b>泥</b>混在一起。那里氧气很少。分解是<b>不完全的</b>。</span></li>\n<li>More sediment buried the mud. The mud was squashed into a rock called <b>shale</b>. The dead plankton changed into a waxy material called <b>kerogen</b>.<span class=\"zh\">更多的沉积物掩埋了泥。泥被压成一种叫<b>页岩</b>的岩石。死去的浮游生物变成一种像蜡一样的物质，叫<b>干酪根</b>。</span></li>\n<li>Deeper down, <b>heat and pressure</b> changed the kerogen into <b>crude oil</b>. This took <b>millions of years</b>.<span class=\"zh\">在更深的地方，<b>热和压力</b>把干酪根变成<b>原油</b>。这需要<b>数百万年</b>。</span></li>\n</ol>\n{{FIG:oilstages}}\n<p class=\"examtip\">Oil is <b>not</b> made from dinosaurs! It comes from tiny sea life. The rock where oil forms is the <b>source rock</b>.<span class=\"zh\">石油<b>不是</b>由恐龙形成的！它来自海里的微小生物。形成石油的岩石叫<b>烃源岩</b>。</span></p>\n<div class=\"gloss\"><h3>Key words <span class=\"zhi\">关键词</span></h3><div class=\"tblwrap\"><table class=\"st\"><thead><tr><th>English</th><th>中文</th><th>Meaning</th></tr></thead><tbody><tr><td><button type=\"button\" class=\"say\" data-say=\"plankton\" aria-label=\"Listen to plankton\">🔊</button> <b>plankton</b></td><td class=\"zhc\">浮游生物</td><td>very small living things that float in the sea</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"seabed\" aria-label=\"Listen to seabed\">🔊</button> <b>seabed</b></td><td class=\"zhc\">海底</td><td>the floor of the sea</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"sink /   "teach": "<button type=\"button\" class=\"listen\" data-listen>🔊 Listen (English)</button>\n<p>Natural gas is mostly <b>methane</b> (CH₄). It forms in the <b>same way as oil</b>, from plankton in seabed mud.<span class=\"zh\">天然气主要是<b>甲烷</b>（CH₄）。它的形成方式<b>和石油一样</b>，来自海底泥中的浮游生物。</span></p>\n<p>The difference is the <b>temperature</b>. If the rock is buried <b>deeper</b>, it gets <b>hotter</b>. Then the kerogen and oil break into smaller molecules: <b>gas</b>.<span class=\"zh\">区别在于<b>温度</b>。如果岩石埋得<b>更深</b>，就会<b>更热</b>。这时干酪根和石油分解成更小的分子：<b>天然气</b>。</span></p>\n{{FIG:window}}\n<p>So oil and gas are often <b>found together</b>. They come from the same rock.<span class=\"zh\">所以石油和天然气经常<b>在一起被发现</b>。它们来自同一种岩石。</span></p>\n<p>Some natural gas also forms from <b>coal</b>. This is why coal mines can have dangerous methane gas.<span class=\"zh\">有些天然气也由<b>煤</b>形成。这就是为什么煤矿里会有危险的甲烷气体。</span></p>\n<div class=\"gloss\"><h3>Key words <span class=\"zhi\">关键词</span></h3><div class=\"tblwrap\"><table class=\"st\"><thead><tr><th>English</th><th>中文</th><th>Meaning</th></tr></thead><tbody><tr><td><button type=\"button\" class=\"say\" data-say=\"methane\" aria-label=\"Listen to methane\">🔊</button> <b>methane</b></td><td class=\"zhc\">甲烷</td><td>the main gas in natural gas, CH₄</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"molecule\" aria-label=\"Listen to molecule\">🔊</button> <b>molecule</b></td><td class=\"zhc\">分子</td><td>a very, very small particle</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"oil window\" aria-label=\"Listen to oil window\">🔊</button> <b>oil window</b></td><td class=\"zhc\">生油窗</td><td>the temperatures where oil forms</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"gas window\" aria-label=\"Listen to gas window\">🔊</button> <b>gas window</b></td><td class=\"zhc\">生气窗</td><td>hotter temperatures where gas forms</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"deeper\" aria-label=\"Listen to   "teach": "<button type=\"button\" class=\"listen\" data-listen>🔊 Listen (English)</button>\n<p>Oil and gas do not stay in the source rock. They are <b>less dense</b> than water (lighter for their size). So they slowly move <b>up</b>.<span class=\"zh\">石油和天然气不会留在烃源岩里。它们的<b>密度比水小</b>（同样大小更轻）。所以它们慢慢向<b>上</b>移动。</span></p>\n<p>They move through <b>porous</b> rock, like <b>sandstone</b>. Porous rock has tiny holes between the grains. Liquids and gases can flow through it. It is <b>permeable</b>.<span class=\"zh\">它们穿过<b>多孔的</b>岩石，例如<b>砂岩</b>。多孔岩石的颗粒之间有微小的孔隙。液体和气体可以流过它。它是<b>可渗透的</b>。</span></p>\n<p>They stop when they reach <b>cap rock</b>. Cap rock is <b>impermeable</b>: liquids and gases cannot go through it. Shale and clay are examples. Often the rocks make a <b>dome</b> shape. This is a <b>trap</b>.<span class=\"zh\">当它们遇到<b>盖层</b>时就停下来。盖层是<b>不可渗透的</b>：液体和气体不能穿过它。页岩和黏土就是例子。岩石常常形成<b>穹顶</b>形状。这就是<b>圈闭</b>。</span></p>\n{{FIG:trap}}\n<p>In the trap, <b>gas is at the top</b>, then <b>oil</b>, then <b>water</b> at the bottom.<span class=\"zh\">在圈闭中，<b>天然气在最上面</b>，然后是<b>石油</b>，<b>水</b>在最下面。</span></p>\n<p class=\"examtip\">It is <b>not</b> an underground lake! The oil is in the tiny holes in the rock, like water in a sponge.<span class=\"zh\">这<b>不是</b>地下湖！石油在岩石的微小孔隙里，就像海绵里的水。</span></p>\n<div class=\"gloss\"><h3>Key words <span class=\"zhi\">关键词</span></h3><div class=\"tblwrap\"><table class=\"st\"><thead><tr><th>English</th><th>中文</th><th>Meaning</th></tr></thead><tbody><tr><td><button type=\"button\" class=\"say\" data-say=\"dense / density\" aria-label=\"Listen to dense / density\">🔊</button> <b>dense / density</b></td><td class=\"zhc\">密度</td><td>how heavy something is for its size</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"migrate\" aria-label=\"Listen to migrate\">🔊</button> <b>migrate</b></td><td class=\"zhc\">运移</td><td>to move slowly</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"porous\" aria-label=\"Listen to porous\">🔊</button> <b>porous</b></td><td class=\"zhc\">多孔的</td><td>with many tiny holes</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"permeable\" aria-label=\"Listen to permeable\">🔊</button> <b>permeable</b></td><td class=\"zhc\">可渗透的</td><td>liquids can flow through it</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"impermeable\" aria-label=\"Listen to impermeable\">🔊</button> <b>impermeable</b></td><td class=\"zhc\">不可渗透的</td><td>liquids cannot flow through it</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"cap rock\" aria-label=\"Listen to cap rock\">🔊</button> <b>cap rock</b></td><td class=\"zhc\">盖层</td><td>the rock on top that stops oil and gas</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"reservoir rock\" aria-label=\"Listen to reservoir rock\">🔊</button> <b>reservoir rock</b></td><td class=\"zhc\">储集岩</td><td>the rock that holds the oil and gas</td></tr><tr><td><button type=\"button\" class=\"say\" data-say=\"trap\" aria-label=\"Listen to trap\">🔊</button> <b>trap</b></td><td class=\"zhc\">圈闭</td><td>a place where oil and gas stop and collect</td></tr></tbody></table></div></div>\n",

  "tz": "总结",
  "teach": "<button type=\"button\" class=\"listen\" data-listen>🔊 Listen (English)</button>\n<p>Use this table to compare the three fossil fuels.<span class=\"zh\">用这张表比较三种化石燃料。</span></p>\n{{FIG:compare}}\n<p class=\"examtip\"><b>Exam tip:</b> to <b>describe the formation</b>, write the steps in order: <b>what</b> died → <b>where</b> → <b>buried</b> by sediment → <b>little oxygen</b>, so decay is incomplete → <b>heat and pressure</b> → <b>millions of years</b>.<span class=\"zh\"><b>考试提示：</b><b>描述形成过程</b>时，要按顺序写出步骤：<b>什么</b>死了 → 在<b>哪里</b> → 被沉积物<b>掩埋</b> → <b>氧气少</b>，所以分解不完全 → <b>热和压力</b> → <b>数百万年</b>。</span></p>\n<div class=\"model\"><h3>Model answer: how coal formed <span class=\"zhi\">范文：煤是怎样形成的</span></h3><p>Coal formed from <b>plants</b> that lived in <b>swamps</b> millions of years ago. When the plants died, they fell into the water. There was <b>little oxygen</b>, so they did <b>not fully decay</b>. They formed <b>peat</b>. <b>Sediment</b> buried the peat. Over <b>millions of years</b>, <b>heat and pressure</b> changed it into coal.<span class=\"zh\">煤由数百万年前生活在沼泽里的植物形成。植物死后倒进水里。那里氧气很少，所以它们没有完全分解，形成了泥炭。沉积物掩埋了泥炭。经过数百万年，热和压力把它变成了煤。</span></p>\n<h3>Model answer: how oil and gas formed <span class=\"zhi\">范文：石油和天然气是怎样形成的</span></h3><p>Oil and gas formed from <b>plankton</b> in the sea. When the plankton died, they sank into <b>mud</b> on the seabed. There was <b>little oxygen</b>, so they did <b>not fully decay</b>. <b>Sediment</b> buried them. Over <b>millions of years</b>, <b>heat and pressure</b> changed them into oil. At <b>higher temperatures</b>, natural gas formed.<span class=\"zh\">石油和天然气由海里的浮游生物形成。浮游生物死后沉入海底的泥里。那里氧气很少，所以它们没有完全分解。沉积物掩埋了它们。经过数百万年，热和压力把它们变成石油。在更高的温度下，形成了天然气。</span></p>\n</div>\n",

  s += `<path class="rig" d="M ${cx - 16} 40 L ${cx} 6 L ${cx + 16} 40 M ${cx - 10} 26 L ${cx + 10} 26"/><line class="well" x1="${cx}" y1="40" x2="${cx}" y2="${crest + 14}"/>`;

  const mk = (n, x, y) => `<circle class="mk" cx="${x}" cy="${y}" r="13"/><text class="mkn" x="${x}" y="${y + 6}" text-anchor="middle">${n}</text>`;
  s += mk(1, cx + 34, 20) + mk(2, 420, capT - A * g(420) + 17) + mk(3, cx, crest + 11) + mk(4, cx + 70, crest + 36) + mk(5, 470, resT - A * g(470) + 32) + mk(6, 60, srcB - A * g(60) - 8);
  return `<figure class="fig">${s}</svg><ol class="key"><li><b>Drilling rig</b><span class="zh">钻机</span></li><li><b>Cap rock</b>: impermeable (e.g. shale)<span class="zh">盖层：不可渗透（例如页岩）</span></li><li><b>Natural gas</b>: at the top<span class="zh">天然气：在最上面</span></li><li><b>Oil</b>: below the gas<span class="zh">石油：在天然气下面</span></li><li><b>Reservoir rock</b>: porous (e.g. sandstone), with water below the oil<span class="zh">储集岩：多孔（例如砂岩），石油下面有水</span></li><li><b>Source rock</b> (shale): where oil and gas formed<span class="zh">烃源岩（页岩）：石油和天然气形成的地方</span></li><li class="nk"><span class="mig"></span> oil and gas moving up · 石油和天然气向上移动</li></ol><figcaption>A dome-shaped trap. Oil and gas rise through porous rock until an impermeable cap rock stops them.</figcaption></figure>`;
};

/* --- S8: summary table --- */
F.compare = () => `<figure class="fig"><div class="tblwrap"><table class="st">
  <thead><tr><th></th><th>Coal 煤</th><th>Petroleum (oil) 石油</th><th>Natural gas 天然气</th></tr></thead>
  <tbody>
    <tr><th>Formed from<span class="zh">形成自</span></th><td>Plants (trees, ferns)<span class="zh">植物（树、蕨类）</span></td><td>Plankton<span class="zh">浮游生物</span></td><td>Plankton (some from coal)<span class="zh">浮游生物（部分来自煤）</span></td></tr>
    <tr><th>Where<span class="zh">在哪里</span></th><td>Swamp forests on land<span class="zh">陆地上的沼泽森林</span></td><td>Seabed mud<span class="zh">海底的泥</span></td><td>Seabed mud<span class="zh">海底的泥</span></td></tr>
    <tr><th>Middle stage<span class="zh">中间阶段</span></th><td>Peat<span class="zh">泥炭</span></td><td>Kerogen<span class="zh">干酪根</span></td><td>Kerogen<span class="zh">干酪根</span></td></tr>
    <tr><th>Conditions<span class="zh">条件</span></th><td colspan="3">Buried by sediment · little or no oxygen · incomplete decay · heat and pressure · millions of years<span class="zh">被沉积物掩埋 · 氧气很少或没有 · 不完全分解 · 热和压力 · 数百万年</span></td></tr>
    <tr><th>Found<span class="zh">存在于</span></th><td>Seams between layers of rock<span class="zh">岩层之间的煤层</span></td><td colspan="2">In porous rock, under a cap rock (a trap)<span class="zh">在多孔岩石中，盖层下面（圈闭）</span></td></tr>
  </tbody></table></div><figcaption>What is the same and what is different.</figcaption></figure>`;

/* ===== Walk-through engine ===== */
const KEY = "igcse-em-fossil-fuels-zh-walkthrough-v1";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LET = "ABCD";
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const CHECKS = SECTIONS.flatMap(s => s.checks);

let P = { sec: 0, res: {} };           // saved progress
try { const raw = localStorage.getItem(KEY); if (raw) P = Object.assign(P, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

/* Balanced answer positions: each letter is correct equally often, never 3 times running. */
const bags = { main: [], back: [] }, hist = { main: [], back: [] };
function deal(name, n, allowed) {
  const bag = bags[name], h = hist[name];
  const ok = t => t < n && (!allowed || allowed.includes(t)) && !(h.length >= 2 && h[h.length - 1] === t && h[h.length - 2] === t);
  let k = -1;
  for (let tries = 0; tries < 3 && k < 0; tries++) { for (let j = bag.length - 1; j >= 0; j--) if (ok(bag[j])) { k = j; break; } if (k < 0) bag.unshift(...shuffle([0, 1, 2, 3])); }
  const t = k >= 0 ? bag.splice(k, 1)[0] : (allowed ? allowed[0] : 0); h.push(t); return t;
}
function orderFor(n, correct, t, fixed) {
  const idx = [...Array(n).keys()];
  if (fixed) { const desc = idx.slice().reverse(); if (n - 1 - correct === t) return desc; if (correct === t) return idx; return Math.random() < .5 ? idx : desc; }
  const rest = shuffle(idx.filter(i => i !== correct)); rest.splice(t, 0, correct); return rest;
}
function order(q, bag) { return orderFor(q.o.length, q.a, deal(bag, q.o.length, q.fixed ? [q.a, q.o.length - 1 - q.a] : null), q.fixed); }

/* Live state of the current check */
let R = null;
const sectionDone = i => SECTIONS[i].checks.every(c => P.res[c.id]);
const unlocked = () => { let i = 0; while (i < SECTIONS.length && sectionDone(i)) i++; return i; }; // first unfinished section

function renderChips() {
  const u = unlocked();
  $("#chips").innerHTML = SECTIONS.map((s, i) => `<button type="button" data-i="${i}" class="${sectionDone(i) ? "done" : ""}" ${P.sec === i ? 'aria-current="step"' : ""} ${i > u ? "disabled title=\"Finish the earlier sections first\"" : ""}><span class="n">${sectionDone(i) ? "✓" : i + 1}</span>${esc(s.title)}</button>`).join("")
    + `<button type="button" data-i="end" ${P.sec === "end" ? 'aria-current="step"' : ""} ${u < SECTIONS.length ? "disabled" : ""}><span class="n">★</span>Summary</button>`;
  $("#chips").querySelectorAll("button").forEach(b => b.addEventListener("click", () => goSection(b.dataset.i === "end" ? "end" : +b.dataset.i)));
  const cur = $("#chips").querySelector('[aria-current="step"]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function goSection(i) { P.sec = i; save(); R = null; render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); }

function fillFigs(html) { return html.replace(/\{\{FIG:(\w+)\}\}/g, (m, k) => F[k] ? F[k]() : ""); }

function render() {
  renderChips();
  if (P.sec === "end") return renderEnd();
  if (P.sec > unlocked()) P.sec = unlocked();
  const s = SECTIONS[P.sec];
  const done = s.checks.filter(c => P.res[c.id]);
  const next = s.checks.find(c => !P.res[c.id]);
  $("#main").innerHTML = `
    <section class="card"><div class="eyebrow">Section ${P.sec + 1} of ${SECTIONS.length}</div><h2>${esc(s.title)}${s.tz ? `<span class="zhi">${esc(s.tz)}</span>` : ""}</h2><div class="notes">${fillFigs(s.teach)}</div></section>
    <section class="card check" id="checkcard">
      ${done.length ? `<div class="passed">${done.map(c => `<div><span class="tag ${P.res[c.id]}">${P.res[c.id] === "first" ? "First try" : P.res[c.id] === "help" ? "After help" : "Revisit"}</span><span>${esc(c.q)}</span></div>`).join("")}</div>` : ""}
      <div id="qzone"></div>
    </section>`;
  wireFig();
  if (next) startCheck(next);
  else finishSection();
}

function wireFig() {
  const fig = $("#inhib-fig"); if (!fig) return;
  const show = { normal: true, comp: false, nonc: false };
  const apply = () => { fig.querySelectorAll("[data-curve]").forEach(g => g.classList.toggle("off", !show[g.dataset.curve])); fig.querySelectorAll(".tog").forEach(b => { b.classList.toggle("on", show[b.dataset.show]); b.setAttribute("aria-pressed", show[b.dataset.show]); }); };
  fig.querySelectorAll(".tog[data-show]").forEach(b => b.addEventListener("click", () => { if (b.dataset.show !== "normal") { show[b.dataset.show] = !show[b.dataset.show]; apply(); } }));
  apply();
}

function startCheck(c) {
  R = { c, phase: "main", bi: 0, first: null, order: order(c, "main"), bOrder: null };
  drawQ(); clearLog();
}

function curQ() { return R.phase === "back" ? R.c.b[R.bi] : R.c; }
function curOrder() { return R.phase === "back" ? R.bOrder : R.order; }

function drawQ() {
  const c = R.c, s = SECTIONS[P.sec], q = curQ(), ord = curOrder();
  const idx = s.checks.indexOf(c) + 1;
  let label, cls = "";
  if (R.phase === "main") label = `Check ${idx} of ${s.checks.length}`;
  else if (R.phase === "back") { label = `Back-up question ${R.bi + 1} of ${c.b.length}`; cls = "backup"; }
  else { label = `Second try · Check ${idx}`; cls = "retry"; }
  const trail = R.phase === "main" ? "" : `<div class="trail"><b class="done">Check</b>${c.b.map((_, k) => `<i>→</i><b class="${R.phase === "back" && R.bi === k ? "on" : (R.phase === "retry" || R.bi > k ? "done" : "")}">Back-up ${k + 1}</b>`).join("")}<i>→</i><b class="${R.phase === "retry" ? "on" : ""}">Second try</b></div>`;
  $("#qzone").innerHTML = `
    <div class="qhead"><span class="stage ${cls}">${label}</span></div>${trail}
    ${q.fig ? F[q.fig]() : ""}
    <p class="stem"><button type="button" class="say" data-say="${esc(q.q)}" aria-label="Listen to the question">🔊</button> ${esc(q.q)}${q.qz ? `<span class="zh">${esc(q.qz)}</span>` : ""}</p>
    <div class="opts" id="opts">${ord.map((oi, pos) => `<button type="button" class="opt" data-oi="${oi}" id="opt-${pos}"><span class="k">${LET[pos]}</span><span>${esc(q.o[oi])}${q.oz ? `<span class="zh">${esc(q.oz[oi])}</span>` : ""}</span><span class="mark"></span></button>`).join("")}</div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="actions" id="actions"></div>`;
  $("#opts").querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.oi)));
}
function clearLog() { const l = $("#log"); if (l) l.innerHTML = ""; }
function letter(oi) { return LET[curOrder().indexOf(oi)]; }
function lock(chosen, correct, reveal) {
  $("#opts").querySelectorAll(".opt").forEach(b => {
    const oi = +b.dataset.oi; b.disabled = true;
    if (oi === chosen && chosen === correct) { b.classList.add("right"); b.querySelector(".mark").textContent = "Correct"; }
    else if (oi === chosen) { b.classList.add("wrong"); b.querySelector(".mark").textContent = "Your answer"; }
    else if (oi === correct && reveal) { b.classList.add("right"); b.querySelector(".mark").textContent = "Answer"; }
    else b.classList.add("dim");
  });
}
function msg(kind, title, text, zh) {
  const d = document.createElement("div"); d.className = "msg " + kind;
  d.innerHTML = (title ? `<h3>${esc(title)}</h3>` : "") + `<p>${esc(text)}</p>` + (zh ? `<p class="zh">${esc(zh)}</p>` : "");
  $("#log").appendChild(d);
}
function actions(list) {
  const a = $("#actions"); a.innerHTML = "";
  list.forEach((it, k) => { const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (it.ghost ? " ghost" : ""); b.textContent = it.label; b.addEventListener("click", it.go); a.appendChild(b); if (k === 0) setTimeout(() => { b.focus({ preventScroll: true }); b.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }); }, 0); });
}

function choose(oi) {
  const c = R.c, q = curQ();
  if (R.phase === "back") {
    const ok = oi === q.a; lock(oi, q.a, true);
    msg(ok ? "good" : "bad", ok ? "Correct" : `The answer is ${letter(q.a)}`, q.x, q.xz);
    const last = R.bi === c.b.length - 1;
    actions([{ label: last ? "Try the check question again" : "Next back-up question", go: () => {
      if (last) { R.phase = "retry"; const was = R.order.indexOf(c.a); if (c.fixed) { const f = R.order.slice().reverse(); if (f.indexOf(c.a) !== was) R.order = f; } else { const t = shuffle([0, 1, 2, 3].filter(p => p !== was))[0]; R.order = orderFor(4, c.a, t, false); } drawQ(); msg("hint", "Second try", "The options are in a new order. Read them carefully.", "选项的顺序变了，请仔细阅读。"); }
      else { R.bi++; R.bOrder = order(c.b[R.bi], "back"); drawQ(); }
      focusFirst();
    } }]);
    return;
  }
  const ok = oi === c.a;
  if (R.phase === "main") {
    if (ok) { lock(oi, c.a, false); msg("good", "Correct", c.x, c.xz); record("first"); }
    else {
      lock(oi, c.a, false); R.first = oi;
      msg("bad", `Not quite: ${letter(oi)} isn't right`, c.w[oi] || "That isn't the right answer.", c.wz && c.wz[oi]);
      msg("hint", "Let's check the basics", `Answer ${c.b.length} short back-up questions. Then try this question again. You can read the notes again first.`, "先回答两道简短的补充问题，然后再试一次这道题。你可以先重新阅读上面的笔记。");
      actions([{ label: "Start the back-up questions", go: () => { R.phase = "back"; R.bi = 0; R.bOrder = order(c.b[0], "back"); drawQ(); focusFirst(); } }]);
    }
    return;
  }
  lock(oi, c.a, true);
  if (ok) { msg("good", "Correct on the second try", c.x, c.xz); record("help"); }
  else { msg("bad", `Not this time. The answer is ${letter(c.a)}`, (c.w[oi] ? c.w[oi] + " " : "") + c.x, ((c.wz && c.wz[oi]) ? c.wz[oi] + " " : "") + (c.xz || "")); record("miss"); }
}
function focusFirst() { const b = $("#opt-0"); if (b) { b.focus({ preventScroll: true }); $("#qzone").scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" }); } }

function record(result) {
  P.res[R.c.id] = result; save(); renderChips();
  const s = SECTIONS[P.sec], next = s.checks.find(c => !P.res[c.id]);
  if (next) actions([{ label: "Next check question", go: () => { render(); setTimeout(() => $("#checkcard").scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" }), 0); } }]);
  else actions(sectionNav());
}
function sectionNav() {
  const last = P.sec === SECTIONS.length - 1;
  return [{ label: last ? "See your summary" : `Next section: ${SECTIONS[P.sec + 1].title}`, go: () => goSection(last ? "end" : P.sec + 1) }];
}
function finishSection() {
  const s = SECTIONS[P.sec];
  $("#qzone").innerHTML = `<p>You've finished this section's checks.</p><div class="actions" id="actions"></div>`;
  const a = sectionNav().concat([{ label: "Redo this section's questions", ghost: true, go: () => { s.checks.forEach(c => delete P.res[c.id]); save(); render(); } }]);
  const box = $("#actions");
  a.forEach(it => { const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (it.ghost ? " ghost" : ""); b.textContent = it.label; b.addEventListener("click", it.go); box.appendChild(b); });
}

function renderEnd() {
  const n = CHECKS.length, c = { first: 0, help: 0, miss: 0 };
  CHECKS.forEach(k => { if (P.res[k.id]) c[P.res[k.id]]++; });
  const pts = c.first + c.help * 0.5;
  const fmt = v => (v % 1 ? Math.floor(v) + "½" : String(v));
  $("#main").innerHTML = `
    <section class="card"><div class="eyebrow">Summary</div>
      <div class="big">${fmt(pts)}<small> / ${n} checks</small></div>
      <p>${c.first} right first time · ${c.help} right after the back-up questions · ${c.miss} to revisit</p>
      <div class="secs">${SECTIONS.map((s, i) => { const r = s.checks.map(k => P.res[k.id]); const worst = r.includes("miss") ? "miss" : r.includes("help") ? "help" : "first";
        return `<div class="row"><span><span class="tag ${worst}">${worst === "first" ? "Secure" : worst === "help" ? "Getting there" : "Revisit"}</span> ${esc(s.title)}</span><button type="button" class="linkbtn" data-go="${i}">Go to section</button></div>`; }).join("")}</div>
    </section>
    <section class="card"><h2>Key points</h2><ol class="keys">${SUMMARY.map(t => `<li>${esc(t[0])}<span class="zh">${esc(t[1])}</span></li>`).join("")}</ol>
      <div class="actions"><button type="button" class="btn ghost" id="restart">Start again from the beginning</button><span id="confirm" class="note"></span></div></section>`;
  $("#main").querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => goSection(+b.dataset.go)));
  let armed = false;
  $("#restart").addEventListener("click", () => {
    if (!armed) { armed = true; $("#confirm").textContent = "This clears your answers. Click again to confirm."; setTimeout(() => { armed = false; const el = $("#confirm"); if (el) el.textContent = ""; }, 5000); return; }
    P = { sec: 0, res: {} }; save(); goSection(0);
  });
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || !R) return;
  const i = "ABCD".indexOf(e.key.toUpperCase()); const j = i >= 0 ? i : "1234".indexOf(e.key);
  if (j >= 0 && e.key.length === 1) { const b = $("#opt-" + j); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
});

render();

/* ===== Bilingual helpers: Chinese toggle and read-aloud ===== */
(function () {
  const ZKEY = "igcse-em-ff-zh-show";
  let show = true; try { show = localStorage.getItem(ZKEY) !== "0"; } catch (e) {}
  const btn = document.getElementById("zhtog");
  const apply = () => { document.body.classList.toggle("no-zh", !show); btn.setAttribute("aria-pressed", show); btn.innerHTML = `中文 Chinese: <b>${show ? "ON" : "OFF"}</b>`; };
  btn.addEventListener("click", () => { show = !show; try { localStorage.setItem(ZKEY, show ? "1" : "0"); } catch (e) {} apply(); });
  apply();

  const synth = window.speechSynthesis;
  let voice = null;
  const pick = () => { if (!synth) return; const v = synth.getVoices(); voice = v.find(x => /en-GB/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null; };
  if (synth) { pick(); synth.onvoiceschanged = pick; }
  function speak(text, onend) {
    if (!synth) { alertNoSpeech(); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = 0.85; if (voice) u.voice = voice;
    if (onend) { u.onend = onend; u.onerror = onend; }
    synth.speak(u);
  }
  function alertNoSpeech() { const n = document.createElement("p"); n.className = "note"; n.textContent = "Read-aloud is not available in this browser."; document.querySelector("header").appendChild(n); }
  document.addEventListener("click", e => {
    const s = e.target.closest("[data-say]");
    if (s) { e.preventDefault(); e.stopPropagation(); speak(s.dataset.say); return; }
    const l = e.target.closest("[data-listen]");
    if (l) {
      if (l.classList.contains("on")) { synth && synth.cancel(); l.classList.remove("on"); l.textContent = "🔊 Listen (English)"; return; }
      const notes = l.closest(".notes"); const c = notes.cloneNode(true);
      c.querySelectorAll(".zh, .zhi, .zhc, .fig, .gloss, button, .model").forEach(x => x.remove());
      const text = c.textContent.replace(/\s+/g, " ").replace(/→/g, ", then ").trim();
      l.classList.add("on"); l.textContent = "■ Stop";
      speak(text, () => { l.classList.remove("on"); l.textContent = "🔊 Listen (English)"; });
    }
  }, true);
})();

</script>
